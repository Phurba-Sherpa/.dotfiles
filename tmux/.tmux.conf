setw -g mode-keys vi
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -in'
# set -g default-terminal "tmux-256color":

set -g base-index 1
setw -g pane-base-index 1
# Mouse support for resizing/selecting
set -g mouse on

# Auto-renumber windows when one is closed
set -g renumber-windows on

# Our config makes it:
#keybind = cmd+b:send_text all \x02
bind | split-window -h -c "#{pane_current_path}"  # Visual: |
bind - split-window -v -c "#{pane_current_path}"  # Visual: -

# Plus keeps current directory path in new panes
# Reload config shortcut
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Status bar improvements
set -g status-position bottom
set -g status-bg colour234
set -g status-fg colour137
set -g status-left '#[fg=colour233,bg=colour241,bold] #S '
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

# Vim-style pane navigation (no prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window status
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
